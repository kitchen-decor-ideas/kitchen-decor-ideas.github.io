<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kitchen decor ideas for a warmer everyday home. Explore sage green cabinets, cozy coffee corners, terracotta palettes, and open shelf styling.">
<meta name="theme-color" content="#f7f4ec">
<title>Kitchen Decor Ideas</title>
<link rel="icon" type="image/png" href="./assets/blog-avatar.png">
<style>
:root{--paper:#f7f4ec;--ink:#28362c;--muted:#647065;--olive:#52603c;--clay:#a45339;--line:#dcded1;--white:#fffdf8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit}img{display:block;max-width:100%}h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.12}h1,h2,h3,p{margin-top:0}
a,button{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:3px solid var(--clay);outline-offset:5px}button{cursor:pointer}
.skip{position:absolute;left:20px;top:-80px;background:var(--white);padding:12px;z-index:50}.skip:focus{top:12px}
.wrap{max-width:1180px;margin:auto;padding:0 32px}.top{border-bottom:1px solid var(--line)}.nav-wrap{display:flex;justify-content:space-between;align-items:center;gap:26px;min-height:108px}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none}.brand img{width:54px;height:54px;border-radius:50%}.brand span{font-family:Georgia,serif;font-size:23px;line-height:1.15;max-width:160px}.brand small{display:block;font:9px Arial,sans-serif;letter-spacing:2.2px;margin-top:8px;text-transform:uppercase}
nav{display:flex;gap:24px;align-items:center}nav a{text-decoration:none;font-size:12px}nav a:hover,nav a[aria-current]{color:var(--clay)}.nav-save{border:1px solid var(--line);padding:9px 15px;border-radius:30px}
.eyebrow{text-transform:uppercase;letter-spacing:2.4px;font-size:10px;font-weight:700;color:var(--olive)}
.hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center;margin:54px 0 62px}.hero h1{font-size:clamp(46px,5.2vw,70px);letter-spacing:-2.5px;margin:20px 0 22px}.hero h1 em{color:var(--clay);font-weight:400}.hero p{color:var(--muted);font-size:15px;max-width:390px}.pill{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:30px;padding:5px 12px;margin:0 5px 10px 0}
.primary{display:inline-flex;gap:24px;align-items:center;color:var(--white);background:var(--olive);padding:12px 22px;border-radius:3px;text-decoration:none;font-size:12px;margin-top:10px}.primary:hover{background:var(--ink)}
.hero-visual{position:relative}.hero-visual>a{display:block;overflow:hidden;border-radius:140px 4px 4px 4px}.hero-visual img{width:100%;height:485px;object-fit:cover;object-position:44% center;transition:transform .5s}.hero-visual a:hover img{transform:scale(1.025)}
.hero-note{position:absolute;bottom:20px;left:-22px;max-width:225px;background:var(--white);padding:19px 23px;box-shadow:0 6px 24px #26352b12;border:1px solid var(--line)}.hero-note span{font-size:9px;letter-spacing:2px;color:var(--clay);text-transform:uppercase}.hero-note strong{font:22px Georgia,serif;display:block;line-height:1.15;margin:8px 0}.hero-note a{font-size:10px;text-decoration:underline;text-underline-offset:4px}
.section-head{border-top:1px solid var(--line);padding-top:28px;display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.section-head h2{font-size:34px;letter-spacing:-.6px;margin:8px 0 0}.section-head p{margin:0;font-size:12px;color:var(--muted)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}.filters button{font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:30px;padding:7px 15px}.filters button[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:white}.filters button:hover{border-color:var(--olive)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px 30px}.card{min-width:0}.card-image{position:relative;overflow:hidden;border-radius:3px}.card-image>a{display:block}.card-image img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;transition:transform .5s}.card-image>a:hover img{transform:scale(1.035)}
.save{position:absolute;right:14px;top:14px;border:1px solid #ffffff99;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;background:#fffdf8ef;color:var(--olive);font-size:20px;line-height:1}.save[aria-pressed=true]{background:var(--olive);color:white;border-color:var(--olive)}
.card .eyebrow{display:block;margin:20px 0 9px;font-size:9px;letter-spacing:1.8px}.card h2{font-size:29px;letter-spacing:-.5px;margin:0 0 14px;max-width:470px}.card h2 a{text-decoration:none}.card h2 a:hover{color:var(--clay)}.excerpt{font-size:13px;color:var(--muted)}.excerpt p{margin-bottom:10px}.excerpt ul{padding-left:19px;margin:0 0 12px}.excerpt .tags{font-size:11px;color:var(--olive)}
.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:14px 0 0;font-size:10px;gap:12px}.card-footer a{text-decoration:none;color:var(--clay)}
.editor-note{margin:62px 0;background:#e9ecdf;display:flex;gap:27px;align-items:center;padding:32px 40px;border-radius:4px}.editor-note img{width:82px;height:82px;border-radius:50%;flex-shrink:0}.editor-note h2{font-size:28px;margin-bottom:10px}.editor-note p{margin:0;font-size:13px;color:var(--muted);max-width:700px}
footer{border-top:1px solid var(--line);padding:25px 0;font-size:11px;color:var(--muted)}.footer-inner{display:flex;justify-content:space-between;gap:20px}.footer-inner a{text-underline-offset:4px}
.back{display:inline-block;color:var(--olive);font-size:12px;text-decoration:none;margin:30px 0 25px}.article{max-width:860px;margin:0 auto 65px}.article-title{font-size:clamp(35px,5vw,57px);letter-spacing:-1.7px;margin:13px 0 20px}.byline{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:25px}.byline img{width:36px;height:36px;border-radius:50%}.byline time{display:block}.article-image{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:4px}.caption{font-size:10px;color:var(--muted);margin:8px 0 30px}.article-body{background:var(--white);padding:35px 42px;border:1px solid var(--line);font-size:16px;overflow-wrap:anywhere}.article-body p{margin-bottom:20px}.article-body li{margin-bottom:7px}.article-actions{display:flex;align-items:center;justify-content:space-between;margin-top:25px;gap:15px}.article-actions button{border:1px solid var(--olive);background:transparent;color:var(--olive);padding:10px 18px;border-radius:3px;font-size:12px}.article-actions button[aria-pressed=true]{background:var(--olive);color:white}.article-actions a{font-size:12px;color:var(--clay)}.page{max-width:780px;margin:0 auto 70px}.page h1{font-size:48px;margin-bottom:25px}.page h2{font-size:27px;margin-top:28px}.empty{padding:50px 0;color:var(--muted)}.notice{font-size:11px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:800px){.wrap{padding:0 22px}.nav-wrap{align-items:flex-start;padding:23px 0;flex-direction:column;gap:18px}nav{gap:16px;flex-wrap:wrap}.hero{gap:25px;margin-top:35px}.hero h1{font-size:46px}.hero-visual img{height:420px}.hero-note{left:-10px;max-width:190px}.hero-note strong{font-size:20px}.brand span{max-width:none;font-size:22px}.brand small{font-size:8px}.article-body{padding:28px}}
@media(max-width:560px){.wrap{padding:0 18px}nav{gap:14px}nav a{font-size:11px}.hero{grid-template-columns:1fr;gap:28px;margin:32px 0 48px}.hero h1{font-size:51px;max-width:360px}.hero p{max-width:100%}.hero-visual img{height:370px}.hero-visual>a{border-top-left-radius:100px}.hero-note{left:12px;bottom:15px}.grid{grid-template-columns:1fr;gap:34px}.section-head{align-items:flex-start;flex-direction:column;gap:10px}.section-head h2{font-size:30px}.editor-note{padding:25px;gap:20px;align-items:flex-start}.editor-note img{width:55px;height:55px}.editor-note h2{font-size:25px}.footer-inner{flex-direction:column;gap:9px}.article-body{padding:23px 18px;font-size:15px}.article-title{letter-spacing:-1px}.article-actions{align-items:flex-start;flex-direction:column}.page h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<header class="top"><div class="wrap nav-wrap"><a class="brand" href="#home"><img src="./assets/blog-avatar.png" alt="" width="54" height="54"><span>Kitchen Decor Ideas<small>A little inspiration for home</small></span></a><nav aria-label="Main navigation"><a href="#home" data-nav="home">Home</a><a href="#about" data-nav="about">About</a><a href="#privacy" data-nav="privacy">Privacy Policy</a><a href="#terms" data-nav="terms">Terms</a><a href="#contact" data-nav="contact">Contact</a><a class="nav-save" href="#saved" data-nav="saved">Saved ideas <span id="saved-count">0</span></a></nav></div></header>
<main id="main" class="wrap" tabindex="-1"><div id="app"></div></main>
<footer><div class="wrap footer-inner"><span>© 2026 Kitchen Decor Ideas · Make room for everyday beauty.</span><span><a href="#privacy">Privacy</a> &nbsp; / &nbsp; <a href="#contact">Contact</a></span></div></footer>
<div id="announcement" role="status" aria-live="polite" class="notice wrap"></div>
<noscript><p class="wrap">Please enable JavaScript to browse the articles.</p></noscript>
<script src="./posts.js"></script>
<script>
const app = document.getElementById('app');
const name = 'Kitchen Decor Ideas';
const avatarUrl = './assets/blog-avatar.png';
let saved = new Set();
try { const stored = JSON.parse(localStorage.getItem('kitchen-decor-saved') || '[]'); if (Array.isArray(stored)) saved = new Set(stored.filter(id => posts.some(p => p.id === id))); } catch {}
let category = 'All ideas';
const pages = {
about: { title: 'A warmer everyday kitchen', content: '<p>Welcome to <strong>Kitchen Decor Ideas</strong>, a small collection of inspiration for the spaces where everyday life happens.</p><p>We explore welcoming color palettes, thoughtful storage, cozy coffee corners, and the details that make a kitchen feel like home. Each guide connects a visual idea with practical ways to adapt it to your own room.</p><h2>Our approach</h2><p>Start with what you have. Choose useful objects, leave space for cooking, and bring in color and texture at your own pace.</p><p>The kitchen images on this site are generated illustrations of interior ideas. They are inspiration concepts, rather than photographs of completed client projects.</p>' },
privacy: { title: 'Privacy Policy', content: '<p class="notice">Last updated: October 1, 2026</p><h2>Information used by this page</h2><p>This page has no account registration, contact form, advertising scripts, or analytics integrations. Browsing articles does not ask you to submit personal information.</p><h2>Saved ideas</h2><p>When you save an idea, its article identifier is stored in your browser using local storage. The page uses this information to show your saved collection on this browser. It is not sent to a server by this page. Remove an idea with its save button, or clear your browser site data to erase the saved collection.</p><h2>Hosting and email</h2><p>The service hosting this site may process technical request information under its own policies. Contacting us by email uses your email provider and sends the information you choose to include to the recipient.</p><h2>Changes</h2><p>If this site adds services that process visitor information, this notice should be updated to reflect those services.</p><p>For questions about this page, use the <a href="#contact">contact page</a>.</p>' },
terms: { title: 'Terms of Use', content: '<p class="notice">Last updated: October 1, 2026</p><p>Kitchen Decor Ideas shares general interior decorating inspiration. Use the ideas in a way that fits your space, budget, and needs.</p><h2>Using the content</h2><p>You may browse the articles and save ideas in your browser for personal reference. Contact us before republishing site content.</p><h2>Planning your project</h2><p>Images illustrate design concepts and do not establish dimensions, product specifications, or installation details. Check measurements, material care instructions, appliance guidance, and fixing requirements for your own project.</p><h2>Availability</h2><p>Content may be edited over time. This page does not provide purchasing, installation, or professional design services.</p><p>For questions, visit <a href="#contact">Contact</a>.</p>' },
contact: { title: 'Let’s talk kitchens', content: '<p>Have a question about an article, an idea for a future guide, or feedback on the site? We would love to hear from you.</p><p><strong>Email</strong><br><a href="mailto:contact@carolynadamsulo-creator.github.io">contact@carolynadamsulo-creator.github.io</a></p><p>Please include the article title if your message relates to a particular idea.</p>' }
};
function escapeHTML(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function excerptHTML(value) {
 const lines = value.split('\n');
 return '<p>' + escapeHTML(lines[0]) + '</p><ul>' + lines.filter(l => l.startsWith('•')).map(l => '<li>' + escapeHTML(l.slice(1).trim()) + '</li>').join('') + '</ul><p class="tags">' + escapeHTML(lines.find(l => l.startsWith('#')) || '') + '</p><p>' + escapeHTML(lines.at(-1)) + '</p>';
}
function saveButton(post, full=false) {
 const active = saved.has(post.id);
 return '<button class="' + (full ? 'save-full' : 'save') + '" data-save="' + post.id + '" aria-pressed="' + active + '" aria-label="' + (active ? 'Remove saved idea: ' : 'Save idea: ') + escapeHTML(post.title) + '">' + (full ? (active ? 'Saved to your ideas ✓' : 'Save this idea +') : (active ? '✓' : '+')) + '</button>';
}
function card(post) {
 return '<article class="card"><div class="card-image"><a href="#' + post.id + '"><img src="' + escapeHTML(post.image) + '" alt="' + escapeHTML(post.alt) + '" width="1536" height="1024" loading="lazy"></a>' + saveButton(post) + '</div><span class="eyebrow">' + escapeHTML(post.category) + '</span><h2><a href="#' + post.id + '">' + escapeHTML(post.title) + '</a></h2><div class="excerpt">' + excerptHTML(post.excerpt) + '</div><div class="card-footer"><time>' + post.date + '</time><a href="#' + post.id + '">Read the story ↗</a></div></article>';
}
function renderGrid(onlySaved=false) {
 const selected = posts.filter(p => (!onlySaved || saved.has(p.id)) && (category === 'All ideas' || p.category === category));
 document.getElementById('post-grid').innerHTML = selected.length ? selected.map(card).join('') : '<p class="empty">No ideas here yet. Explore the stories and use the + button to save your favorites.</p>';
 document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === category)));
}
function renderHome(onlySaved=false) {
 document.title = onlySaved ? 'Saved ideas | ' + name : name;
 const first = posts[0];
 app.innerHTML = (onlySaved ? '' : '<section class="hero" aria-labelledby="hero-title"><div><span class="eyebrow">The heart of a lovely home</span><h1 id="hero-title">Good days<br>start in a<br><em>warm kitchen.</em></h1><p>Thoughtful spaces. Natural textures. Little details that make your everyday kitchen feel a little more like you.</p><div><span class="pill">Considered color</span><span class="pill">Everyday beauty</span></div><a class="primary" href="#' + first.id + '">Explore the featured idea <span aria-hidden="true">↗</span></a></div><div class="hero-visual"><a href="#' + first.id + '"><img src="' + first.image + '" alt="' + first.alt + '" width="1536" height="1024" fetchpriority="high"></a><div class="hero-note"><span>The featured kitchen</span><strong>A softer shade<br>of green.</strong><a href="#' + first.id + '">Step inside the story ↗</a></div></div></section>') +
 '<section aria-labelledby="ideas-title"><div class="section-head"><div><span class="eyebrow">A collection to come back to</span><h2 id="ideas-title">' + (onlySaved ? 'Your saved ideas' : 'The kitchen edit') + '</h2></div><p>' + (onlySaved ? 'A little inspiration, kept close.' : 'Four stories. Plenty of possibilities.') + '</p></div><div class="filters" aria-label="Filter ideas">' + ['All ideas','Color & materials','Everyday corners','Storage & styling'].map(c => '<button data-filter="' + escapeHTML(c) + '" aria-pressed="' + (category === c) + '">' + escapeHTML(c) + '</button>').join('') + '</div><div class="grid" id="post-grid"></div></section>' +
 '<aside class="editor-note"><img src="' + avatarUrl + '" alt="" width="82" height="82"><div><span class="eyebrow">A note from the edit</span><h2>Beautiful can be practical.</h2><p>The best kitchen ideas make room for real life. Start with a color you love, a corner that works, and the things you reach for every day.</p></div></aside>';
 renderGrid(onlySaved);
}
function renderPost(post) {
 document.title = post.title + ' | ' + name;
 const index = posts.indexOf(post), next = posts[(index + 1) % posts.length];
 const minutes = Math.ceil(post.content.replace(/<[^>]*>/g, ' ').split(/\s+/).length / 220);
 app.innerHTML = '<div class="article"><a class="back" href="#home">← Back to the kitchen edit</a><span class="eyebrow" style="display:block">' + escapeHTML(post.category) + '</span><h1 class="article-title">' + escapeHTML(post.title) + '</h1><div class="byline"><img src="' + avatarUrl + '" alt="" width="36" height="36"><div>' + name + ' Edit<time>' + post.date + ' · ' + minutes + ' min read</time></div></div><img class="article-image" src="' + escapeHTML(post.image) + '" alt="' + escapeHTML(post.alt) + '" width="1536" height="1024"><p class="caption">A kitchen inspiration concept created for Kitchen Decor Ideas.</p><div class="article-body">' + post.content + '</div><div class="article-actions">' + saveButton(post,true) + '<a href="#' + next.id + '">Next idea: ' + escapeHTML(next.title) + ' ↗</a></div></div>';
}
function route(scroll=true) {
 let id; try { id = decodeURIComponent(location.hash.slice(1)); } catch { id = ''; }
 if (!id || id === 'home' || id === 'main') renderHome();
 else if (id === 'saved') renderHome(true);
 else if (pages[id]) { document.title = pages[id].title + ' | ' + name; app.innerHTML = '<section class="page"><a class="back" href="#home">← Back to the kitchen edit</a><h1>' + pages[id].title + '</h1><div class="article-body">' + pages[id].content + '</div></section>'; }
 else { const post = posts.find(p => p.id === id); if (post) renderPost(post); else { document.title = 'Idea not found | ' + name; app.innerHTML = '<section class="page"><a class="back" href="#home">← Back to the kitchen edit</a><h1>That idea isn’t here.</h1><p>Explore the kitchen edit to find your next favorite.</p></section>'; } }
 document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === (id || 'home')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
 document.getElementById('saved-count').textContent = saved.size;
 if (scroll) { window.scrollTo(0,0); document.getElementById('main').focus({preventScroll:true}); }
}
app.addEventListener('click', event => {
 const filter = event.target.closest('[data-filter]');
 if (filter) { category = filter.dataset.filter; renderGrid(location.hash === '#saved'); return; }
 const button = event.target.closest('[data-save]');
 if (!button) return;
 const id = button.dataset.save, post = posts.find(p => p.id === id);
 if (!post) return;
 if (saved.has(id)) saved.delete(id); else saved.add(id);
 let persisted = true; try { localStorage.setItem('kitchen-decor-saved',JSON.stringify([...saved])); } catch { persisted = false; }
 document.getElementById('saved-count').textContent = saved.size;
 button.setAttribute('aria-pressed',String(saved.has(id)));
 button.setAttribute('aria-label',(saved.has(id) ? 'Remove saved idea: ' : 'Save idea: ') + post.title);
 button.textContent = button.classList.contains('save-full') ? (saved.has(id) ? 'Saved to your ideas ✓' : 'Save this idea +') : (saved.has(id) ? '✓' : '+');
 document.getElementById('announcement').textContent = (saved.has(id) ? 'Idea saved.' : 'Idea removed.') + (persisted ? '' : ' Browser storage is unavailable; saved ideas will last for this visit.');
 if (location.hash === '#saved') renderGrid(true);
});
window.addEventListener('hashchange',() => route());
route(false);
</script>
